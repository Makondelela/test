<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello </title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f0f4ff, #dfe9ff);
        font-family: Arial, sans-serif;
      }

      .hello-box {
        background: white;
        padding: 2rem 3rem;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        text-align: center;
      }

      h1 {
        margin: 0;
        color: #1f2937;
        font-size: clamp(2rem, 5vw, 4rem);
      }
    </style>
  </head>
  <body>
    <div class="hello-box">
      <h1>Hello, World!</h1>
    </div>
  </body>
</html>
